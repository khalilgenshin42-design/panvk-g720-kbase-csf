name: Build GameNative wrapper with VRS extension enumeration enabled

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/g720-fragment-shading-rate
    paths:
      - .github/workflows/build-wrapper-gamenative-vrs.yml

permissions:
  contents: read

jobs:
  build-wrapper-gamenative:
    name: Build GameNative wrapper (android-strict=false)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout pinned GameNative Mesa source
        uses: actions/checkout@v4
        with:
          repository: GameNative/mesa
          ref: 6bcfbaa701a8d1efa7f6c54145495eda5329f767
          path: gamenative-mesa

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake pkg-config flex bison glslang-tools zstd file unzip
          python3 -m pip install --user --upgrade meson mako pyyaml packaging
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Patch wrapper build configuration
        working-directory: gamenative-mesa
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path(".github/scripts/build-wrapper-gamenative.sh")
          text = script.read_text()
          old = "        -Dvulkan-drivers=wrapper\n"
          new = "        -Dvulkan-drivers=wrapper \\\n        -Dandroid-strict=false\n"
          if text.count(old) != 1:
              raise SystemExit("Expected one wrapper Meson setup terminator")
          text = text.replace(old, new)
          marker = '    mkdir -p "$stage/usr/lib" "$stage/usr/share/vulkan/icd.d"\n'
          version = marker + '''    cat > "$stage/version.txt" <<'VERSION'
          Version: wrapper-25-android-strict-off
          Notes: GameNative wrapper-25 built with android-strict=false so the wrapper does not hide implemented device extensions behind the Android CTS API-level allowlist. Android system Vulkan driver is unchanged.
          VERSION
          '''
          if text.count(marker) != 1:
              raise SystemExit("Expected one wrapper package staging directory")
          text = text.replace(marker, version)
          script.write_text(text)
          PY

          grep -n -A2 -- '-Dvulkan-drivers=wrapper' .github/scripts/build-wrapper-gamenative.sh
          grep -n -A3 'Version: wrapper-25-android-strict-off' .github/scripts/build-wrapper-gamenative.sh

      - name: Build and package GameNative wrapper
        working-directory: gamenative-mesa
        env:
          NDK_VERSION: r29
          ADRENOTOOLS_NDK_VERSION: r28c
          ANDROID_API: "24"
          BUILD_DATE: run-${{ github.run_number }}
        run: |
          ./.github/scripts/build-wrapper-gamenative.sh

      - name: Verify strict filtering is disabled
        working-directory: gamenative-mesa
        run: |
          mkdir -p out/verified
          meson configure work/build-wrapper > out/verified/meson-configure.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path("out/verified/meson-configure.txt").read_text()
          def value(name):
              for line in text.splitlines():
                  if line.strip().startswith(name):
                      return line.split()[-1]
              raise SystemExit(f"Meson option not found: {name}")
          strict = value("android-strict")
          sdk = value("platform-sdk-version")
          print(f"android-strict={strict}, platform-sdk-version={sdk}")
          if strict.lower() != "false":
              raise SystemExit("Wrapper was configured with Android strict filtering enabled")
          if int(sdk) != 25:
              raise SystemExit(f"Unexpected wrapper platform SDK: {sdk}")
          PY
          if grep -q -- '-DANDROID_STRICT' work/build-wrapper/build.ninja; then
            echo "ANDROID_STRICT unexpectedly present in wrapper compile commands"
            exit 1
          fi
          test -f out/wrapper-gamenative-run-${{ github.run_number }}.tzst
          zstd -t out/wrapper-gamenative-run-${{ github.run_number }}.tzst
          zstd -dc out/wrapper-gamenative-run-${{ github.run_number }}.tzst | tar -tf - | grep -Fx 'usr/lib/libvulkan_wrapper.so'
          cp out/wrapper-gamenative-run-${{ github.run_number }}.tzst out/wrapper-gamenative.tzst
          sha256sum out/wrapper-gamenative.tzst > out/wrapper-gamenative.tzst.sha256

      - name: Upload custom wrapper package
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-gamenative-android-strict-off
          path: |
            gamenative-mesa/out/wrapper-gamenative.tzst
            gamenative-mesa/out/wrapper-gamenative.tzst.sha256
            gamenative-mesa/out/verified/meson-configure.txt
          if-no-files-found: error
