name: NIR clip-cull compiler tests

on:
  push:
    branches:
      - experiment/g720-clip-cull-capabilities
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nir-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-mako \
            python3-yaml \
            meson \
            ninja-build \
            bison \
            flex \
            pkg-config \
            libdrm-dev \
            libelf-dev \
            llvm-22-dev \
            libzstd-dev \
            libexpat1-dev \
            clang \
            glslang-tools

      - name: Configure minimal host build with NIR tests
        run: |
          meson setup build \
            -Dplatforms=[] \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=swrast \
            -Dtools=[] \
            -Dbuild-tests=true \
            -Dllvm=enabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglvnd=disabled \
            -Dvalgrind=disabled \
            -Dshared-glapi=disabled \
            -Dzstd=disabled

      - name: Verify NIR tests are registered
        run: |
          meson introspect --tests build > build-tests.json
          python3 -c 'import json; tests=json.load(open("build-tests.json")); names={t["name"] for t in tests}; print("Registered tests:", sorted(names)); assert "nir_tests" in names, "nir_tests was not registered"; assert "nir_algebraic_parser" in names, "nir_algebraic_parser was not registered"'

      - name: Build and run NIR compiler tests
        run: meson test -C build --suite nir --print-errorlogs
