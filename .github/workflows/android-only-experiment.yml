
name: Android-only PanVK G720 Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/kbase-csg-scope-diagnostic
      - experiment/csf-sync-wait64-csg-scope
      - experiment/csf-notification-serialization
      - experiment/kbase-diag-opt-in
      - experiment/kbase-profile-counters
      - experiment/kbase-live-profile
      - experiment/csf-notification-serialization-ci
      - work/android-libdrm-runtime-audit-latest
      - work/winlator-adpkg-packaging

permissions:
  contents: read

jobs:
  build-android-only:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected source branch
        uses: actions/checkout@v4

      - name: Verify checkout
        run: |
          echo "SOURCE_REF=$GITHUB_REF"
          echo "SOURCE_SHA=$GITHUB_SHA"
          test -f meson.build
          test -f android.toml
          grep -n "uint64_t fn_addr" src/panfrost/vulkan/csf/panvk_vX_cmd_draw.c

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            llvm-22-dev \
            libclang-22-dev \
            libclc-22-dev \
            libllvmspirvlib-22-dev \
            libelf-dev \
            spirv-tools \
            spirv-tools-dev \
            bison \
            flex \
            libdrm-dev \
            pkg-config \
            patchelf
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Generate host tools
        run: |
          meson setup build-host \
            -Dplatforms=[] \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=[] \
            -Dtools=panfrost \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true

          ninja -C build-host \
            src/compiler/clc/mesa_clc \
            src/compiler/spirv/vtn_bindgen2 \
            src/panfrost/clc/panfrost_compile

          ln -sf mesa_clc build-host/src/compiler/clc/mesa-clc
          ln -sf vtn_bindgen2 build-host/src/compiler/spirv/vtn-bindgen2
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/clc" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/spirv" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/build-host/src/panfrost/clc" >> "$GITHUB_PATH"

      - name: Build real Android ARM64 libdrm
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/shims
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          envsubst < android.toml > android-cross.txt
          bash .github/scripts/build-android-libdrm.sh

      - name: Configure Android-only build
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/shims
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          envsubst < android.toml > android-cross.txt

          meson setup build-android-only \
            --cross-file android-cross.txt \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dplatform-sdk-version=30 \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglvnd=disabled \
            -Dvalgrind=disabled \
            -Dgallium-drivers= \
            -Dshared-glapi=disabled \
            -Dzstd=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dvulkan-drivers=panfrost \
            -Dllvm=disabled \
            -Dpanfrost-kmds=kbase

      - name: Compile and stage Android install
        run: |
          meson compile -C build-android-only
          DESTDIR="$GITHUB_WORKSPACE/stage" meson install -C build-android-only

      - name: Audit driver, manifest, dependencies and staged files
        run: |
          mkdir -p audit
          DRIVER="build-android-only/src/panfrost/vulkan/libvulkan_panfrost.so"
          test -f "$DRIVER"
          file "$DRIVER" | tee audit/file.txt
          readelf -h "$DRIVER" > audit/elf-header.txt
          readelf -d "$DRIVER" > audit/dynamic-section.txt
          readelf --dyn-syms "$DRIVER" > audit/dynamic-symbols.txt
          grep -E 'NEEDED|SONAME|RPATH|RUNPATH' audit/dynamic-section.txt || true
          grep -E 'HMI|vk_icdGetInstanceProcAddr|vkCreateInstance|vkGetInstanceProcAddr' audit/dynamic-symbols.txt || true
          # Kbase is the selected kernel backend. Mesa's shared Panfrost
          # helpers still use libdrm for generic BO import/sync paths, so
          # ship the Android-target libdrm support library beside the ICD.
          grep -Fq 'Shared library: [libdrm.so]' audit/dynamic-section.txt
          test -f shims/libdrm.so
          readelf -d shims/libdrm.so > audit/libdrm-dynamic-section.txt
          readelf --dyn-syms shims/libdrm.so > audit/libdrm-dynamic-symbols.txt
          grep -Fq 'Library soname: [libdrm.so]' audit/libdrm-dynamic-section.txt

          # Fail if the driver imports a DRM symbol that the bundled library
          # cannot resolve. This checks ABI coverage rather than banning the
          # generic helper dependency.
          nm -D --defined-only shims/libdrm.so | awk '{print $3}' | sed 's/@.*//' | sort -u > audit/libdrm-defined-symbols.txt
          readelf --wide --dyn-syms "$DRIVER" | awk '$7 == "UND" && $8 ~ /^drm[A-Za-z0-9_]+/ {print $8}' | sed 's/@.*//' | sort -u > audit/driver-undefined-drm-symbols.txt
          comm -23 audit/driver-undefined-drm-symbols.txt audit/libdrm-defined-symbols.txt > audit/missing-drm-symbols.txt
          if test -s audit/missing-drm-symbols.txt; then
            cat audit/missing-drm-symbols.txt >&2
            echo 'Bundled libdrm is missing symbols required by the driver' >&2
            exit 1
          fi

          # RUNPATH on the installed ICD is $ORIGIN/../../android_stub.
          # From usr/local/lib this resolves to usr/android_stub.
          mkdir -p stage/usr/android_stub
          cp shims/libdrm.so stage/usr/android_stub/libdrm.so
          readelf -d stage/usr/android_stub/libdrm.so > audit/staged-libdrm-dynamic-section.txt
          find stage -type f -print | sort | tee audit/staged-files.txt
          find stage -type f \( -name '*icd*.json' -o -name '*vulkan*.json' \) -print -exec cat {} \; > audit/icd-manifests.txt
          find stage -type f -name '*.so' -exec sh -c 'echo "### $1"; readelf -d "$1" | grep -E "NEEDED|SONAME|RPATH|RUNPATH" || true' _ {} \; > audit/staged-so-dependencies.txt
          sha256sum "$DRIVER" | tee audit/sha256.txt
          cp "$DRIVER" stage/libvulkan_panfrost.so

      - name: Build flat Winlator/Adrenotools package
        env:
          DRIVER: ${{ github.workspace }}/build-android-only/src/panfrost/vulkan/libvulkan_panfrost.so
          LIBDRM: ${{ github.workspace }}/shims/libdrm.so
          OUT_DIR: ${{ github.workspace }}/package-out
          SOURCE_SHA: ${{ github.sha }}
        run: |
          bash .github/scripts/package-panvk-adpkg.sh
          cp PanVK-G720-experimental.zip audit/
          cp package-out/zip-contents.txt audit/adpkg-zip-contents.txt
          cp package-out/SHA256SUMS audit/adpkg-SHA256SUMS.txt
          sha256sum PanVK-G720-experimental.zip | tee audit/adpkg-zip-sha256.txt

      - name: Upload complete experimental package and audit
        uses: actions/upload-artifact@v4
        with:
          name: panvk-g720-android-only-experimental-package
          path: |
            stage/
            audit/
            PanVK-G720-experimental.zip
          if-no-files-found: error
